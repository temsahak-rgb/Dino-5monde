name: Project Vigie

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - docs/dependency-graph.md
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to refresh
        required: true
        type: number

permissions:
  checks: read
  contents: read
  # PR comments accept pull-requests: write. Keeping issues read-only avoids
  # granting the trusted workflow write access to the repository issue tracker.
  pull-requests: write

concurrency:
  group: project-vigie-${{ github.event.pull_request.number || inputs.pull_request || github.run_id }}
  cancel-in-progress: true

jobs:
  report:
    name: Refresh PR dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      # This workflow deliberately never checks out the pull request head.
      # pull_request_target can write the sticky comment, so every executable
      # file must come from the trusted develop branch. PR feature files are
      # downloaded later as untrusted data and are never executed.
      - name: Resolve pull request and reusable checks
        id: snapshot
        uses: actions/github-script@v8
        env:
          MANUAL_PULL_REQUEST: ${{ inputs.pull_request }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = Number(
              process.env.MANUAL_PULL_REQUEST
              || context.payload.pull_request?.number
              || 0
            );

            if (!pullNumber) {
              core.notice('No pull request was selected for this report.');
              core.setOutput('should_report', 'false');
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            const ref = pull.head.sha;
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pullNumber, per_page: 100 }
            );

            const corpusRequired = files.some(({ filename }) =>
              filename.startsWith('data/')
              || filename.startsWith('tests/data/')
              || filename === 'src/app/routes.ts'
              || filename === 'package.json'
              || filename === 'package-lock.json'
              || filename === '.github/workflows/corpus-quality.yml'
            );

            const latestByName = (checks, name) => checks
              .filter((check) => check.name === name)
              .sort((left, right) =>
                Date.parse(right.started_at ?? right.created_at ?? 0)
                - Date.parse(left.started_at ?? left.created_at ?? 0)
              )[0];

            let quality;
            let e2e;
            let corpus;
            let feature;

            for (let attempt = 1; attempt <= 60; attempt += 1) {
              const { data } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref,
                per_page: 100,
              });

              quality = latestByName(data.check_runs, 'Quality report');
              e2e = latestByName(
                data.check_runs,
                'Startup and i18n (Chromium)'
              );
              corpus = corpusRequired
                ? latestByName(
                    data.check_runs,
                    'Validate educational corpus'
                  )
                : undefined;
              feature = latestByName(
                data.check_runs,
                'Executable feature contracts'
              );

              const expected = [
                quality,
                e2e,
                feature,
                ...(corpusRequired ? [corpus] : []),
              ];

              if (expected.every((check) => check?.status === 'completed')) {
                break;
              }

              core.info(
                `Waiting for existing checks (${attempt}/60): `
                + expected
                  .map((check) => check?.name ?? 'not started')
                  .join(', ')
              );
              await new Promise((resolve) => setTimeout(resolve, 5_000));
            }

            const state = (check) =>
              check?.conclusion
              ?? check?.status
              ?? 'missing';

            core.setOutput('should_report', 'true');
            core.setOutput('pull_number', String(pullNumber));
            core.setOutput('sha', ref);
            core.setOutput('quality_state', state(quality));
            core.setOutput('quality_url', quality?.details_url ?? '');
            core.setOutput('e2e_state', state(e2e));
            core.setOutput('e2e_url', e2e?.details_url ?? '');
            core.setOutput('feature_state', state(feature));
            core.setOutput('feature_url', feature?.details_url ?? '');
            core.setOutput('corpus_required', String(corpusRequired));
            core.setOutput(
              'corpus_state',
              corpusRequired ? state(corpus) : 'not_required'
            );
            core.setOutput('corpus_url', corpus?.details_url ?? '');

      - name: Checkout trusted report code
        if: steps.snapshot.outputs.should_report == 'true'
        uses: actions/checkout@v7
        with:
          ref: develop
          persist-credentials: false

      - name: Setup Node.js
        if: steps.snapshot.outputs.should_report == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install trusted report dependencies
        if: steps.snapshot.outputs.should_report == 'true'
        run: npm ci

      - name: Materialize PR feature files as untrusted data
        if: steps.snapshot.outputs.should_report == 'true'
        uses: actions/github-script@v8
        env:
          FEATURE_REF: ${{ steps.snapshot.outputs.sha }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const ref = process.env.FEATURE_REF;
            const { data: tree } = await github.rest.git.getTree({
              owner,
              repo,
              tree_sha: ref,
              recursive: 'true',
            });

            if (tree.truncated) {
              throw new Error('The repository tree was truncated.');
            }

            const entries = tree.tree.filter((entry) =>
              entry.type === 'blob'
              && entry.path?.startsWith('features/')
              && entry.path.endsWith('.feature')
            );
            const root = path.resolve('reports/pr-features');
            await fs.mkdir(root, { recursive: true });

            for (const entry of entries) {
              const relative = entry.path.slice('features/'.length);
              const segments = relative.split('/');

              if (
                !relative
                || segments.some((segment) =>
                  !segment || segment === '.' || segment === '..'
                )
              ) {
                throw new Error(`Unsafe feature path: ${entry.path}`);
              }

              const target = path.resolve(root, ...segments);

              if (!target.startsWith(`${root}${path.sep}`)) {
                throw new Error(`Feature path escaped report root: ${entry.path}`);
              }

              const { data: blob } = await github.rest.git.getBlob({
                owner,
                repo,
                file_sha: entry.sha,
              });
              const source = Buffer.from(
                blob.content.replace(/\n/g, ''),
                blob.encoding
              ).toString('utf8');

              await fs.mkdir(path.dirname(target), { recursive: true });
              await fs.writeFile(target, source, 'utf8');
            }

      - name: Measure feature progress without executing PR code
        if: steps.snapshot.outputs.should_report == 'true'
        shell: bash
        run: |
          npm run features:report -- \
            --features "reports/pr-features/**/*.feature" \
            --output reports/pr-feature-progress.json \
            --markdown reports/pr-feature-progress.md \
            --allow-invalid

      - name: Build the three-panel dashboard
        if: steps.snapshot.outputs.should_report == 'true'
        shell: bash
        env:
          VIGIE_SHA: ${{ steps.snapshot.outputs.sha }}
          VIGIE_QUALITY_STATE: ${{ steps.snapshot.outputs.quality_state }}
          VIGIE_QUALITY_URL: ${{ steps.snapshot.outputs.quality_url }}
          VIGIE_E2E_STATE: ${{ steps.snapshot.outputs.e2e_state }}
          VIGIE_E2E_URL: ${{ steps.snapshot.outputs.e2e_url }}
          VIGIE_FEATURE_STATE: ${{ steps.snapshot.outputs.feature_state }}
          VIGIE_FEATURE_URL: ${{ steps.snapshot.outputs.feature_url }}
          VIGIE_CORPUS_REQUIRED: ${{ steps.snapshot.outputs.corpus_required }}
          VIGIE_CORPUS_STATE: ${{ steps.snapshot.outputs.corpus_state }}
          VIGIE_CORPUS_URL: ${{ steps.snapshot.outputs.corpus_url }}
        run: |
          mkdir -p reports
          npm run vigie:report -- \
            --feature-report reports/pr-feature-progress.json \
            --output reports/project-vigie.md
          cat reports/project-vigie.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update the sticky PR Vigie
        if: steps.snapshot.outputs.should_report == 'true'
        uses: actions/github-script@v8
        env:
          PULL_NUMBER: ${{ steps.snapshot.outputs.pull_number }}
        with:
          script: |
            const fs = require('node:fs');
            const markers = [
              '<!-- dino-project-vigie -->',
              '<!-- dino-corpus-quality-report -->',
            ];
            const body = fs.readFileSync(
              'reports/project-vigie.md',
              'utf8'
            );
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PULL_NUMBER);
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const botComments = comments.filter(
              (comment) => comment.user?.type === 'Bot'
            );
            const previous = botComments.find(
              (comment) => comment.body?.includes(markers[0])
            ) ?? botComments.find(
              (comment) => comment.body?.includes(markers[1])
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
