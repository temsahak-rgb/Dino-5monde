name: Corpus quality

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "data/**"
      - "tests/data/**"
      - "src/app/routes.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/corpus-quality.yml"
  pull_request:
    paths:
      - "data/**"
      - "tests/data/**"
      - "src/app/routes.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/corpus-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corpus-quality:
    name: Validate educational corpus
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate corpus
        id: corpus
        shell: bash
        run: |
          mkdir -p reports
          set +e
          set -o pipefail

          npm run test:data 2>&1 | tee reports/corpus-quality.txt
          STATUS=${PIPESTATUS[0]}

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build readable corpus report
        if: always()
        shell: bash
        env:
          CORPUS_STATUS: ${{ steps.corpus.outputs.status }}
        run: |
          npm run corpus:report -- \
            --input reports/corpus-quality.txt \
            --output reports/corpus-pr-report.md \
            --status "$CORPUS_STATUS"

          cat reports/corpus-pr-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update sticky pull request report
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- dino-corpus-quality-report -->";
            const body = fs.readFileSync(
              "reports/corpus-pr-report.md",
              "utf8"
            );
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100
              }
            );
            const previous = comments.find(
              comment =>
                comment.user?.type === "Bot"
                && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-quality-report
          path: reports/
          retention-days: 14
          if-no-files-found: error

      - name: Enforce corpus quality gate
        if: always() && steps.corpus.outputs.status != '0'
        shell: bash
        run: |
          echo "Corpus validation failed. See the sticky PR report or artifact."
          exit 1
