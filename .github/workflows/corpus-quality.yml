name: Corpus quality

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "data/**"
      - "tests/data/**"
      - "src/app/routes.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/corpus-quality.yml"
  pull_request:
    paths:
      - "data/**"
      - "tests/data/**"
      - "src/app/routes.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/corpus-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corpus-quality:
    name: Validate educational corpus
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate corpus
        id: corpus
        shell: bash
        run: |
          mkdir -p reports
          set +e
          set -o pipefail

          npm run test:data 2>&1 | tee reports/corpus-quality.txt
          STATUS=${PIPESTATUS[0]}

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build readable corpus report
        if: always()
        shell: bash
        env:
          CORPUS_STATUS: ${{ steps.corpus.outputs.status }}
        run: |
          npm run corpus:report -- \
            --input reports/corpus-quality.txt \
            --output reports/corpus-pr-report.md \
            --status "$CORPUS_STATUS"

          cat reports/corpus-pr-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-quality-report
          path: reports/
          retention-days: 14
          if-no-files-found: error

      - name: Enforce corpus quality gate
        if: always() && steps.corpus.outputs.status != '0'
        shell: bash
        run: |
          echo "Corpus validation failed. See the sticky PR report or artifact."
          exit 1
