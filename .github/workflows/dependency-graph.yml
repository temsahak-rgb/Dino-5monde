name: Dependency graph

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-graph:
    name: Generate dependency graph
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate graph from TypeScript imports
        run: npm run graph:dependencies

      - name: Commit updated graph
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- docs/dependency-graph.md; then
            echo "Dependency graph is already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dependency-graph.md
          git commit -m "docs: update dependency graph [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"

          echo "Dependency graph updated on \`${TARGET_BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"
