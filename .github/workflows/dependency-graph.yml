name: Dependency graph

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-graph:
    name: Generate dependency graph
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate graph from TypeScript imports
        run: npm run graph:dependencies

      - name: Verify committed graph is current
        run: git diff --exit-code -- docs/dependency-graph.md
