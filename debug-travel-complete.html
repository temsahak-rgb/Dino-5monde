<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 دیباگ کامل Travel</title>
    <style>
        body { font-family: Tahoma; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #087F5B; }
        .setup { background: #f0f9ff; border: 2px solid #087F5B; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; margin: 12px 0 6px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { background: #087F5B; color: white; border: none; padding: 14px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
        .log { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; margin-top: 20px; max-height: 500px; overflow-y: auto; font-family: monospace; font-size: 13px; line-height: 1.6; }
        .log-success { color: #00ff00; } .log-error { color: #ff4444; } .log-info { color: #44aaff; } .log-warning { color: #ffaa00; }
        .lesson-preview { background: #f9fafb; border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px; margin-top: 10px; }
        .lesson-item { background: white; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 دیباگ کامل Travel Lessons</h1>
        <p>این ابزار همه چیز را بررسی می‌کند تا مشکل را پیدا کنیم.</p>

        <div class="setup">
            <label>GitHub Token:</label>
            <input type="password" id="token" placeholder="ghp_...">
            
            <label>نام کاربری:</label>
            <input type="text" id="username" value="temsahak-rgb">
            
            <label>نام مخزن:</label>
            <input type="text" id="repo" value="Dino-5monde">
        </div>

        <button class="btn" onclick="fullDebug()">🔍 بررسی کامل و نمایش درس‌ها</button>

        <div class="log" id="log"></div>
    </div>

    <script>
        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('fa-IR');
            logDiv.innerHTML += `<div class="log-${type}">[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function githubGet(path, token, user, repo) {
            const url = `https://api.github.com/repos/${user}/${repo}/contents/${path}`;
            const res = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
            if (!res.ok) throw new Error(`HTTP ${res.status}: ${path}`);
            return await res.json();
        }

        async function fullDebug() {
            const token = document.getElementById('token').value.trim();
            const username = document.getElementById('username').value.trim();
            const repo = document.getElementById('repo').value.trim();

            if (!token) {
                log('❌ Token را وارد کن', 'error');
                return;
            }

            log('🔍 شروع بررسی کامل...', 'info');

            // ۱. بررسی existence فایل‌ها
            log('\n📂 مرحله ۱: بررسی existence فایل‌ها', 'info');
            
            const paths = [
                { path: 'data/travel/lessons.json', desc: 'فهرست درس‌ها' },
                { path: 'data/travel/lessons', desc: 'پوشه درس‌ها' }
            ];

            for (const { path, desc } of paths) {
                try {
                    await githubGet(path, token, username, repo);
                    log(`  ✅ ${desc} وجود دارد: ${path}`, 'success');
                } catch (e) {
                    log(`  ❌ ${desc} وجود ندارد: ${path}`, 'error');
                    log(`     خطا: ${e.message}`, 'error');
                }
            }

            // ۲. خواندن lessons.json
            log('\n📋 مرحله ۲: خواندن lessons.json', 'info');
            
            let lessons = [];
            try {
                const lessonsFile = await githubGet('data/travel/lessons.json', token, username, repo);
                const content = decodeURIComponent(escape(atob(lessonsFile.content)));
                lessons = JSON.parse(content);
                
                log(`  ✅ ${lessons.length} درس در فهرست پیدا شد`, 'success');
                
                if (lessons.length === 0) {
                    log('  ⚠️ فهرست خالی است! باید ربات generate-travel-index.html را اجرا کنی', 'warning');
                    return;
                }

                // نمایش اولین ۵ درس
                log('\n📚 اولین ۵ درس:', 'info');
                lessons.slice(0, 5).forEach((lesson, idx) => {
                    log(`  ${idx + 1}. ${lesson.icon} ${lesson.title_fa} (${lesson.id})`, 'info');
                });

            } catch (e) {
                log(`  ❌ خطا در خواندن lessons.json: ${e.message}`, 'error');
                return;
            }

            // ۳. بررسی existence پوشه lessons
            log('\n📁 مرحله ۳: بررسی پوشه lessons/', 'info');
            
            let lessonFiles = [];
            try {
                const filesList = await githubGet('data/travel/lessons', token, username, repo);
                lessonFiles = filesList.filter(f => f.name.endsWith('.json'));
                log(`  ✅ ${lessonFiles.length} فایل JSON در پوشه lessons/`, 'success');
                
                lessonFiles.slice(0, 10).forEach(file => {
                    log(`    📄 ${file.name}`, 'info');
                });

            } catch (e) {
                log(`  ❌ پوشه lessons/ وجود ندارد: ${e.message}`, 'error');
                return;
            }

            // ۴. تست خواندن یک درس
            log('\n🎯 مرحله ۴: تست خواندن یک درس', 'info');
            
            if (lessons.length > 0) {
                const firstLesson = lessons[0];
                const lessonPath = `data/travel/lessons/${firstLesson.id}.json`;
                
                try {
                    const lessonFile = await githubGet(lessonPath, token, username, repo);
                    const lessonContent = JSON.parse(decodeURIComponent(escape(atob(lessonFile.content))));
                    
                    log(`  ✅ درس "${firstLesson.title_fa}" با موفقیت خوانده شد`, 'success');
                    log(`     - ID: ${lessonContent.id}`, 'info');
                    log(`     - عنوان: ${lessonContent.title_fa || lessonContent.title}`, 'info');
                    log(`     - مینی‌درس‌ها: ${lessonContent.miniLessons ? lessonContent.miniLessons.length : 0}`, 'info');
                    
                    if (lessonContent.miniLessons && lessonContent.miniLessons.length > 0) {
                        log(`     - اولین مینی‌درس: ${lessonContent.miniLessons[0].title}`, 'info');
                    }

                } catch (e) {
                    log(`  ❌ فایل درس پیدا نشد: ${lessonPath}`, 'error');
                    log(`     خطا: ${e.message}`, 'error');
                    log(`     💡 احتمالاً ID در lessons.json با نام فایل مطابقت ندارد`, 'warning');
                }
            }

            // ۵. بررسی تطابق ID ها
            log('\n🔍 مرحله ۵: بررسی تطابق ID ها', 'info');
            
            const fileNames = lessonFiles.map(f => f.name.replace('.json', ''));
            const lessonIds = lessons.map(l => l.id);
            
            let matchCount = 0;
            lessonIds.forEach(id => {
                if (fileNames.includes(id)) {
                    matchCount++;
                } else {
                    log(`  ⚠️ ID "${id}" در lessons.json هست ولی فایل ${id}.json وجود ندارد`, 'warning');
                }
            });
            
            log(`  ✅ ${matchCount} از ${lessonIds.length} ID با فایل‌ها مطابقت دارند`, 'success');

            // ۶. نمایش نهایی
            log('\n\n✅ بررسی کامل شد!', 'success');
            log(`📊 خلاصه:`, 'success');
            log(`  - ${lessons.length} درس در فهرست`, 'success');
            log(`  - ${lessonFiles.length} فایل در پوشه lessons/`, 'success');
            log(`  - ${matchCount} ID مطابقت دارد`, 'success');

            if (matchCount === lessons.length && lessons.length > 0) {
                log('\n🎉 همه چیز درست است! مشکل از جای دیگری است.', 'success');
                log('💡 احتمالاً:', 'info');
                log('  1. travel.js در index.html اضافه نشده', 'info');
                log('  2. router.js case travel ندارد', 'info');
                log('  3. کش مرورگر را پاک کن (Ctrl+Shift+R)', 'info');
            }
        }

        window.onload = function() {
            if (localStorage.getItem('dino_token')) document.getElementById('token').value = localStorage.getItem('dino_token');
        };
    </script>
</body>
</html>
