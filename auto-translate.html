<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 ربات ترجمه Google Translate - B1</title>
    <style>
        body { font-family: Tahoma; padding: 20px; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        h1 { color: #087F5B; text-align: center; }
        .setup { background: #f0f9ff; border: 2px solid #087F5B; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; margin: 12px 0 6px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
        .btn { background: #087F5B; color: white; border: none; padding: 16px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn:hover:not(:disabled) { background: #066b4c; }
        .btn:disabled { background: #ccc; }
        .btn-reset { background: #f59e0b; }
        .btn-continue { background: #2563eb; }
        .btn-stop { background: #dc2626; }
        .btn-test { background: #8b5cf6; }
        .log { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; margin-top: 20px; max-height: 500px; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.5; }
        .log-success { color: #00ff00; } .log-error { color: #ff4444; } .log-info { color: #44aaff; } .log-warning { color: #ffaa00; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .stat-box { background: #f0f9ff; padding: 12px; border-radius: 6px; text-align: center; border: 1px solid #087F5B; }
        .stat-value { font-size: 24px; font-weight: bold; color: #087F5B; }
        .stat-label { font-size: 11px; color: #777; }
        .progress-bar { background: #e0e0e0; height: 12px; border-radius: 6px; overflow: hidden; margin: 15px 0; }
        .progress-fill { background: linear-gradient(90deg, #087F5B, #10b981); height: 100%; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 ربات ترجمه Google Translate</h1>
        <p style="text-align: center; color: #777; margin-bottom: 20px;">رایگان، بدون API key، کیفیت بالا</p>

        <div class="setup">
            <label>GitHub Token:</label>
            <input type="password" id="token" placeholder="ghp_...">
            <button class="btn btn-test" onclick="testGoogleTranslate()">🧪 تست Google Translate</button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">کل جملات</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="statDone">0</div>
                <div class="stat-label">ترجمه شده</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="statFailed">0</div>
                <div class="stat-label">ترجمه نشده</div>
            </div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

        <button class="btn btn-reset" id="resetBtn" onclick="resetAndCollect()">🧹 گام ۱: پاک‌سازی + جمع‌آوری جملات</button>
        <button class="btn" id="startBtn" onclick="startTranslation()" style="display:none;">🚀 گام ۲: شروع ترجمه (۲۰ جمله)</button>
        <button class="btn btn-continue" id="continueBtn" onclick="continueTranslation()" style="display:none;">✅ ادامه ترجمه</button>
        <button class="btn btn-stop" id="stopBtn" onclick="stopTranslation()" style="display:none;">⏹ توقف و ذخیره</button>

        <div class="log" id="log"></div>
    </div>

    <script>
        let shouldStop = false;
        let allSentences = [];
        let currentSentenceIndex = 0;
        let totalSentences = 0;
        let translatedCount = 0;
        let failedCount = 0;

        const USER = "temsahak-rgb";
        const REPO = "Dino-5monde";
        const LEVEL = "B1";

        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('fa-IR');
            logDiv.innerHTML += `<div class="log-${type}">[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        function updateStats() {
            document.getElementById('statTotal').textContent = totalSentences;
            document.getElementById('statDone').textContent = translatedCount;
            document.getElementById('statFailed').textContent = failedCount;
            const pct = totalSentences > 0 ? ((translatedCount + failedCount) / totalSentences) * 100 : 0;
            document.getElementById('progressFill').style.width = pct + '%';
        }

        async function githubGet(path, token) {
            const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${path}`, { 
                headers: { 'Authorization': `token ${token}` } 
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        }

        async function githubPut(path, content, sha, token, message) {
            const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(content))), sha })
            });
            if (!res.ok) throw new Error(`PUT failed`);
        }

        // ============ ترجمه با Google Translate (غیررسمی) ============
        async function translateWithGoogle(text) {
            if (!text || text.trim().length < 3) return text;

            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=fr&tl=fa&dt=t&q=${encodeURIComponent(text.trim())}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data && data[0]) {
                    let translated = '';
                    for (const segment of data[0]) {
                        if (segment[0]) {
                            translated += segment[0];
                        }
                    }
                    
                    if (translated && translated.length > 0) {
                        return translated.trim();
                    }
                }
                
                log(`    ⚠️ Google Translate پاسخ خالی داد`, 'warning');
                return text;
            } catch (e) {
                log(`    ❌ خطا: ${e.message}`, 'error');
                return text;
            }
        }

        // ============ تست Google Translate ============
        async function testGoogleTranslate() {
            log('🧪 تست Google Translate...', 'info');
            
            try {
                const result = await translateWithGoogle('Bonjour le monde');
                if (result && result !== 'Bonjour le monde') {
                    log(`✅ Google Translate کار می‌کند: "${result}"`, 'success');
                } else {
                    log('❌ Google Translate پاسخ نامعتبر داد', 'error');
                }
            } catch (e) {
                log(`❌ خطا: ${e.message}`, 'error');
            }
        }

        // ============ تقسیم متن به جملات ============
        function splitToSentences(text) {
            const sentences = [];
            let current = '';
            
            for (let i = 0; i < text.length; i++) {
                current += text[i];
                
                if ((text[i] === '.' || text[i] === '?' || text[i] === '!') && current.length >= 20) {
                    sentences.push(current.trim());
                    current = '';
                }
                
                if (current.length > 400) {
                    sentences.push(current.trim());
                    current = '';
                }
            }
            
            if (current.trim()) sentences.push(current.trim());
            
            return sentences;
        }

        // ============ تشخیص خرابی ============
        function isTranslationBroken(text) {
            if (!text || text.trim() === '') return false;
            const words = text.trim().split(/\s+/);
            if (words.length === 0) return false;
            const latinWords = words.filter(w => /^[a-zA-ZÀ-ÿ]{3,}$/.test(w));
            return (latinWords.length / words.length) * 100 > 50;
        }

        // ============ گام ۱: پاک‌سازی + جمع‌آوری ============
        async function resetAndCollect() {
            const token = document.getElementById('token').value.trim();
            if (!token) {
                log('❌ GitHub Token را وارد کنید', 'error');
                return;
            }

            localStorage.setItem('dino_token', token);
            document.getElementById('resetBtn').disabled = true;
            allSentences = [];
            translatedCount = 0;
            failedCount = 0;

            log('🧹 شروع پاک‌سازی و جمع‌آوری جملات...', 'info');

            try {
                const listFile = await githubGet(`data/vocabulary/vocab-${LEVEL}.json`, token);
                const list = JSON.parse(decodeURIComponent(escape(atob(listFile.content))));
                
                log(`📊 ${list.length} پک در B1 پیدا شد`, 'info');

                for (const pack of list) {
                    const path = `data/vocabulary/${LEVEL}/${pack.id}.json`;
                    
                    try {
                        const file = await githubGet(path, token);
                        const packData = JSON.parse(decodeURIComponent(escape(atob(file.content))));
                        
                        let changed = false;
                        
                        if (packData.stories) {
                            for (const [key, story] of Object.entries(packData.stories)) {
                                if (isTranslationBroken(story.text_fa)) {
                                    log(`  🗑️ ${pack.id} - ${key}.text_fa خراب → پاک شد`, 'warning');
                                    story.text_fa = "";
                                    changed = true;
                                }
                                
                                if (isTranslationBroken(story.title_fa)) {
                                    log(`  🗑️ ${pack.id} - ${key}.title_fa خراب → پاک شد`, 'warning');
                                    story.title_fa = "";
                                    changed = true;
                                }
                                
                                if (story.paragraphs) {
                                    for (let i = 0; i < story.paragraphs.length; i++) {
                                        if (isTranslationBroken(story.paragraphs[i].fa)) {
                                            story.paragraphs[i].fa = "";
                                            changed = true;
                                        }
                                    }
                                }
                                
                                if (story.text && story.text_fa === "") {
                                    const sentences = splitToSentences(story.text.replace(/\{\{BLANK_\d+\}\}/g, '___'));
                                    sentences.forEach(s => {
                                        allSentences.push({
                                            packId: pack.id,
                                            storyKey: key,
                                            type: 'text_fa',
                                            sentence: s,
                                            path: path,
                                            sha: file.sha
                                        });
                                    });
                                }
                                
                                if (story.title && story.title_fa === "") {
                                    allSentences.push({
                                        packId: pack.id,
                                        storyKey: key,
                                        type: 'title_fa',
                                        sentence: story.title,
                                        path: path,
                                        sha: file.sha
                                    });
                                }
                                
                                if (story.paragraphs) {
                                    for (let i = 0; i < story.paragraphs.length; i++) {
                                        const para = story.paragraphs[i];
                                        if (para.fr && para.fa === "") {
                                            allSentences.push({
                                                packId: pack.id,
                                                storyKey: key,
                                                type: 'paragraph_fa',
                                                paraIndex: i,
                                                sentence: para.fr,
                                                path: path,
                                                sha: file.sha
                                            });
                                        }
                                    }
                                }
                            }
                        }
                        
                        if (changed) {
                            await githubPut(path, JSON.stringify(packData, null, 2), file.sha, token, `🧹 reset: ${pack.id}`);
                            log(`  ✅ ${pack.id} پاک‌سازی شد`, 'success');
                        }
                        
                        await sleep(500);
                        
                    } catch (e) {
                        log(`  ❌ خطا در ${pack.id}: ${e.message}`, 'error');
                    }
                }

                totalSentences = allSentences.length;
                log(`\n✅ ${totalSentences} جمله برای ترجمه جمع‌آوری شد`, 'success');
                updateStats();
                
                document.getElementById('startBtn').style.display = 'inline-block';
                
            } catch (e) {
                log(`❌ خطا: ${e.message}`, 'error');
            }

            document.getElementById('resetBtn').disabled = false;
        }

        // ============ گام ۲: شروع ترجمه ============
        async function startTranslation() {
            const token = document.getElementById('token').value.trim();
            
            if (allSentences.length === 0) {
                log('❌ هیچ جمله‌ای برای ترجمه نیست', 'error');
                return;
            }

            document.getElementById('startBtn').disabled = true;
            document.getElementById('continueBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'inline-block';
            
            await translateBatch(0, 20, token);
        }

        // ============ ترجمه دسته‌ای ============
        async function translateBatch(startIndex, count, token) {
            const end = Math.min(startIndex + count, allSentences.length);
            log(`\n🔄 ترجمه جملات ${startIndex + 1} تا ${end}...`, 'info');

            const fileChanges = {};

            for (let i = startIndex; i < end; i++) {
                if (shouldStop) break;

                const item = allSentences[i];
                log(`  📝 ${item.packId} - جمله ${i + 1}/${totalSentences}...`, 'info');
                
                const translated = await translateWithGoogle(item.sentence);
                
                if (translated !== item.sentence) {
                    translatedCount++;
                    log(`    ✅ ترجمه شد: "${translated.substring(0, 50)}..."`, 'success');
                } else {
                    failedCount++;
                    log(`    ⚠️ ترجمه نشد`, 'warning');
                }
                
                item.translated = translated;
                
                if (!fileChanges[item.path]) {
                    fileChanges[item.path] = { sha: item.sha, changes: [] };
                }
                fileChanges[item.path].changes.push(item);
                
                updateStats();
                await sleep(800); // تاخیر کوتاه برای Google
            }

            log(`\n💾 ذخیره تغییرات در GitHub...`, 'info');
            await saveChanges(fileChanges, token);

            if (end < allSentences.length && !shouldStop) {
                currentSentenceIndex = end;
                log(`\n✅ ${end} جمله پردازش شد. برای ادامه دکمه "ادامه" را بزنید.`, 'success');
            } else {
                log(`\n🎉 تمام جملات پردازش شدند!`, 'success');
                document.getElementById('continueBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'none';
                document.getElementById('startBtn').disabled = false;
            }
        }

        async function saveChanges(fileChanges, token) {
            for (const [path, data] of Object.entries(fileChanges)) {
                try {
                    const file = await githubGet(path, token);
                    const pack = JSON.parse(decodeURIComponent(escape(atob(file.content))));
                    
                    for (const change of data.changes) {
                        if (change.type === 'text_fa') {
                            if (!pack.stories[change.storyKey].text_fa) {
                                pack.stories[change.storyKey].text_fa = '';
                            }
                            pack.stories[change.storyKey].text_fa += change.translated + ' ';
                        } else if (change.type === 'title_fa') {
                            pack.stories[change.storyKey].title_fa = change.translated;
                        } else if (change.type === 'paragraph_fa') {
                            pack.stories[change.storyKey].paragraphs[change.paraIndex].fa = change.translated;
                        }
                    }
                    
                    await githubPut(path, JSON.stringify(pack, null, 2), file.sha, token, `🤖 google-translate: ${path}`);
                    log(`  ✅ ${path} ذخیره شد`, 'success');
                } catch (e) {
                    log(`  ❌ خطا در ${path}: ${e.message}`, 'error');
                }
            }
        }

        async function continueTranslation() {
            const token = document.getElementById('token').value.trim();
            document.getElementById('continueBtn').disabled = true;
            await translateBatch(currentSentenceIndex, 20, token);
            document.getElementById('continueBtn').disabled = false;
        }

        function stopTranslation() {
            shouldStop = true;
            log('⏹ توقف درخواست شد', 'warning');
        }

        window.onload = function() {
            if (localStorage.getItem('dino_token')) {
                document.getElementById('token').value = localStorage.getItem('dino_token');
            }
        };
    </script>
</body>
</html>
