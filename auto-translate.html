<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 ربات ترجمه ایمن و خودکار</title>
    <style>
        body { font-family: Tahoma; padding: 20px; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        h1 { color: #087F5B; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #777; margin-bottom: 25px; font-size: 14px; }
        .setup { background: #f0f9ff; border: 2px solid #087F5B; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; margin: 12px 0 6px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { background: #087F5B; color: white; border: none; padding: 18px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; margin-top: 15px; transition: 0.2s; }
        .btn:hover:not(:disabled) { background: #066b4c; transform: translateY(-2px); }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn-stop { background: #dc2626; }
        .btn-stop:hover:not(:disabled) { background: #b91c1c; }
        .log { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; margin-top: 20px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 13px; line-height: 1.6; }
        .log-success { color: #00ff00; } .log-error { color: #ff4444; } .log-info { color: #44aaff; } .log-warning { color: #ffaa00; }
        .progress-bar { background: #e0e0e0; height: 12px; border-radius: 6px; overflow: hidden; margin: 15px 0; }
        .progress-fill { background: linear-gradient(90deg, #087F5B, #10b981); height: 100%; width: 0%; transition: width 0.3s; }
        .help { background: #fffbeb; border: 1px solid #fde68a; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 ربات ترجمه ایمن و خودکار</h1>
        <p class="subtitle">با سیستم هوشمند تشخیص ترجمه اشتباه</p>

        <div class="help">
            🔑 کلیدها را وارد کنید و دکمه را بزنید. ربات خودش همه پک‌ها را پیدا و ترجمه می‌کند.
        </div>

        <div class="setup">
            <label>Google Gemini API Key:</label>
            <input type="password" id="geminiKey" placeholder="AIza...">
            
            <label>GitHub Token:</label>
            <input type="password" id="token" placeholder="ghp_...">
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        
        <button class="btn" id="startBtn" onclick="startAutoScan()">🚀 شروع ترجمه خودکار کل سایت</button>
        <button class="btn btn-stop" id="stopBtn" onclick="stopTranslation()" style="display:none;">⏹ توقف</button>
        
        <div class="log" id="log"></div>
    </div>

    <script>
        let shouldStop = false;

        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('fa-IR');
            logDiv.innerHTML += `<div class="log-${type}">[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        function updateProgress(current, total) {
            document.getElementById('progressFill').style.width = (total > 0 ? (current / total) * 100 : 0) + '%';
        }

        // بررسی هوشمند: آیا ترجمه واقعاً فارسی است؟
        function isValidTranslation(original, translated) {
            // اگر ترجمه خالی است یا خیلی کوتاه است
            if (!translated || translated.length < 10) return false;
            
            // اگر ترجمه دقیقاً همان متن اصلی است (بدون تغییر)
            if (original.trim() === translated.trim()) return false;
            
            // شمارش کلمات فرانسوی در ترجمه
            const frenchWords = translated.match(/\b[a-zA-Z]{3,}\b/g) || [];
            const totalWords = translated.split(/\s+/).length;
            const frenchPercentage = (frenchWords.length / totalWords) * 100;
            
            // اگر بیشتر از 60% کلمات فرانسوی هستند، ترجمه اشتباه است
            if (frenchPercentage > 60) {
                log(`    ⚠️ ${frenchPercentage.toFixed(0)}% کلمات فرانسوی - ترجمه نامعتبر`, 'warning');
                return false;
            }
            
            return true;
        }

        async function translateWithGemini(text, apiKey) {
            if (!text || text.trim() === '') return '';

            const prompt = `You are a professional French-to-Persian translator.

TASK: Translate the following French text to Persian (Farsi).

RULES:
1. The input text is in French and may contain blanks marked with "___"
2. Translate ONLY to Persian - do NOT keep French words (except proper names like "Bertrand", "Paris", "Wi-Fi")
3. Keep the blanks "___" exactly as they are in the Persian translation
4. Output ONLY the Persian translation - no explanations, no notes
5. The translation must be natural and fluent in Persian

French text to translate:
${text}`;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { 
                            temperature: 0.2,
                            maxOutputTokens: 2048
                        }
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0] && data.candidates[0].content.parts[0]) {
                    let translated = data.candidates[0].content.parts[0].text.trim();
                    
                    // بررسی هوشمند
                    if (!isValidTranslation(text, translated)) {
                        throw new Error("ترجمه نامعتبر - احتمالاً هوش مصنوعی فرانسوی برگردانده");
                    }
                    
                    return translated;
                }
                throw new Error("پاسخ نامعتبر از API");
            } catch (e) {
                log(`❌ خطای ترجمه: ${e.message}`, 'error');
                return null;
            }
        }

        async function githubGet(path, token, user, repo) {
            const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`, { 
                headers: { 'Authorization': `token ${token}` } 
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        }

        async function githubPut(path, content, sha, token, user, repo, message) {
            const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(content))), sha })
            });
            if (!res.ok) throw new Error(`PUT failed`);
        }

        async function checkAndTranslatePack(path, geminiKey, token, user, repo) {
            const file = await githubGet(path, token, user, repo);
            const pack = JSON.parse(decodeURIComponent(escape(atob(file.content))));
            let changed = false;
            let translationFailed = false;

            if (!pack.stories) return { changed, path, sha: file.sha, content: JSON.stringify(pack, null, 2), failed: false };

            for (const [key, story] of Object.entries(pack.stories)) {
                if (shouldStop) break;

                // بررسی و ترجمه text_fa
                if (story.text && (!story.text_fa || /[a-zA-Z]{3,}/.test(story.text_fa))) {
                    log(`  🔄 ترجمه متن داستان ${key}...`, 'info');
                    const cleanText = story.text.replace(/\{\{BLANK_\d+\}\}/g, '___');
                    const translatedText = await translateWithGemini(cleanText, geminiKey);
                    
                    if (translatedText) {
                        story.text_fa = translatedText;
                        changed = true;
                        log(`  ✅ ترجمه شد`, 'success');
                    } else {
                        translationFailed = true;
                        log(`  ⚠️ ترجمه ${key} ناموفق - فایل ذخیره نمی‌شود`, 'warning');
                        break;
                    }
                    await sleep(1500); 
                }

                // بررسی و ترجمه title_fa
                if (!translationFailed && story.title && (!story.title_fa || /[a-zA-Z]{3,}/.test(story.title_fa))) {
                    log(`  🔄 ترجمه عنوان...`, 'info');
                    const translatedTitle = await translateWithGemini(story.title, geminiKey);
                    if (translatedTitle) {
                        story.title_fa = translatedTitle;
                        changed = true;
                    } else {
                        translationFailed = true;
                    }
                    await sleep(1500);
                }

                // بررسی و ترجمه پاراگراف‌ها
                if (!translationFailed && story.paragraphs) {
                    for (const para of story.paragraphs) {
                        if (para.fr && (!para.fa || /[a-zA-Z]{3,}/.test(para.fa))) {
                            log(`  🔄 ترجمه پاراگراف...`, 'info');
                            const translatedPara = await translateWithGemini(para.fr, geminiKey);
                            if (translatedPara) {
                                para.fa = translatedPara;
                                changed = true;
                            } else {
                                translationFailed = true;
                                break;
                            }
                            await sleep(1500);
                        }
                    }
                }
            }
            return { changed, path, sha: file.sha, content: JSON.stringify(pack, null, 2), failed: translationFailed };
        }

        async function startAutoScan() {
            const geminiKey = document.getElementById('geminiKey').value.trim();
            const token = document.getElementById('token').value.trim();
            const user = "temsahak-rgb";
            const repo = "Dino-5monde";

            if (!geminiKey || !token) {
                log('❌ لطفاً API Key و GitHub Token را وارد کنید', 'error');
                return;
            }

            localStorage.setItem('dino_gemini', geminiKey);
            localStorage.setItem('dino_token', token);

            shouldStop = false;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').style.display = 'inline-block';
            log('🔍 جستجو در کل مخزن...', 'info');

            try {
                const levelsToScan = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
                const allPacks = [];

                for (const lv of levelsToScan) {
                    try {
                        const listFile = await githubGet(`data/vocabulary/vocab-${lv}.json`, token, user, repo);
                        const list = JSON.parse(decodeURIComponent(escape(atob(listFile.content))));
                        list.forEach(p => allPacks.push({ level: lv, id: p.id }));
                    } catch (e) { /* نادیده گرفتن */ }
                }

                if (allPacks.length === 0) {
                    log('⚠️ هیچ پکی پیدا نشد', 'warning');
                    return;
                }

                log(`✅ ${allPacks.length} پک پیدا شد`, 'success');
                let fixedCount = 0, skippedCount = 0, failedCount = 0;

                for (let i = 0; i < allPacks.length; i++) {
                    if (shouldStop) {
                        log('⏹ متوقف شد', 'warning');
                        break;
                    }

                    const packInfo = allPacks[i];
                    const path = `data/vocabulary/${packInfo.level}/${packInfo.id}.json`;
                    
                    log(`📦 ${i + 1}/${allPacks.length}: ${packInfo.id}`, 'info');
                    
                    try {
                        const result = await checkAndTranslatePack(path, geminiKey, token, user, repo);
                        
                        if (result.failed) {
                            failedCount++;
                            log(`  🛑 رد شد (خطای ترجمه)`, 'error');
                        } else if (result.changed) {
                            log(`  💾 ذخیره در GitHub...`, 'info');
                            await githubPut(path, result.content, result.sha, token, user, repo, `🤖 safe-translate: ${packInfo.id}`);
                            log(`  ✅ ذخیره شد!`, 'success');
                            fixedCount++;
                        } else {
                            skippedCount++;
                        }
                    } catch (e) {
                        log(`  ❌ خطا: ${e.message}`, 'error');
                    }
                    
                    updateProgress(i + 1, allPacks.length);
                }

                log(`🎉 پایان!`, 'success');
                log(`📊 ${fixedCount} ترجمه موفق | ${skippedCount} سالم | ${failedCount} خطا`, 'success');

            } catch (e) {
                log(`❌ خطای کلی: ${e.message}`, 'error');
            }

            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').style.display = 'none';
        }

        function stopTranslation() {
            shouldStop = true;
            log('⏹ درخواست توقف', 'warning');
        }

        window.onload = function() {
            if (localStorage.getItem('dino_gemini')) document.getElementById('geminiKey').value = localStorage.getItem('dino_gemini');
            if (localStorage.getItem('dino_token')) document.getElementById('token').value = localStorage.getItem('dino_token');
        };
    </script>
</body>
</html>
