<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 اصلاح ترجمه داستان‌ها</title>
    <style>
        body { font-family: Tahoma, Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #087F5B; }
        button { background: #087F5B; color: white; border: none; padding: 14px 28px; border-radius: 6px; cursor: pointer; font-size: 16px; margin: 10px 5px; font-weight: bold; }
        button:hover:not(:disabled) { background: #066b4c; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .log { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 6px; margin-top: 20px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 13px; }
        .success { color: #00ff00; }
        .error { color: #ff4444; }
        .info { color: #44aaff; }
        .warning { color: #ffaa00; }
        textarea { width: 100%; height: 300px; margin-top: 20px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: monospace; font-size: 12px; }
        input[type="file"] { margin: 10px 0; }
        .stats { display: flex; gap: 15px; margin: 15px 0; }
        .stat { background: #f0f9ff; padding: 10px 15px; border-radius: 6px; border: 1px solid #087F5B; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 اصلاح ترجمه داستان‌های خراب</h1>
        <p>این ابزار فقط <code>text_fa</code>های خراب (که متن فرانسوی دارند) را اصلاح می‌کند.</p>
        
        <div>
            <h3>. فایل JSON پک را انتخاب کن:</h3>
            <input type="file" id="fileInput" accept=".json">
        </div>
        
        <div class="stats">
            <div class="stat">📊 جملات: <strong id="statSentences">0</strong></div>
            <div class="stat">✅ ترجمه شده: <strong id="statDone">0</strong></div>
        </div>
        
        <button id="fixBtn" onclick="fixFile()" disabled> شروع اصلاح</button>
        <button id="downloadBtn" onclick="downloadResult()" style="display:none;">💾 دانلود فایل اصلاح‌شده</button>
        
        <div class="log" id="log"></div>
        
        <div id="resultSection" style="display:none;">
            <h3>۲. فایل اصلاح‌شده:</h3>
            <textarea id="resultOutput" readonly></textarea>
        </div>
    </div>

    <script>
        let fixedPack = null;
        const DELAY = 1500;
        let totalSentences = 0;
        let doneSentences = 0;

        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('fa-IR');
            logDiv.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fixBtn').disabled = false;
                log(`✅ فایل انتخاب شد: ${file.name}`, 'success');
            }
        });

        async function translate(text, from = 'fr', to = 'fa') {
            if (!text || text.trim() === '') return '';
            
            const encoded = encodeURIComponent(text);
            const url = `https://api.mymemory.translated.net/get?q=${encoded}&langpair=${from}|${to}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.responseStatus === 200) {
                    return data.responseData.translatedText;
                } else {
                    log(`⚠️ خطا: ${data.responseDetails}`, 'warning');
                    return text;
                }
            } catch (e) {
                log(`❌ خطا: ${e.message}`, 'error');
                return text;
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // تقسیم متن به جملات کوتاه
        function splitToSentences(text) {
            // حفظ blanks به صورت placeholder
            const placeholders = [];
            let processed = text.replace(/\{\{BLANK_(\d+)\}\}/g, (match, num) => {
                placeholders.push({ num, match });
                return `__BLANK_${placeholders.length - 1}__`;
            });
            
            // تقسیم بر اساس نقطه، علامت سوال، علامت تعجب
            const sentences = processed.match(/[^.!?]+[.!?]+/g) || [processed];
            
            return { sentences, placeholders };
        }

        // بازگرداندن blanks
        function restoreBlanks(text, placeholders) {
            placeholders.forEach((p, idx) => {
                text = text.replace(`__BLANK_${idx}__`, p.match);
            });
            return text;
        }

        async function fixFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                log('❌ فایلی انتخاب نشده', 'error');
                return;
            }

            document.getElementById('fixBtn').disabled = true;
            log('🔄 شروع اصلاح...', 'info');

            const content = await file.text();
            const pack = JSON.parse(content);
            let changed = false;

            log(`📦 پک: ${pack.id} (${pack.level})`, 'info');

            if (!pack.stories) {
                log('⏭️ داستان ندارد', 'info');
                return;
            }

            for (const [key, story] of Object.entries(pack.stories)) {
                log(`\n📖 داستان: ${key}`, 'info');

                // بررسی اینکه آیا text_fa خراب است (یعنی حاوی کلمات فرانسوی است)
                if (story.text && story.text_fa) {
                    const hasFrench = /[a-zA-Z]{3,}/.test(story.text_fa);
                    if (hasFrench) {
                        log(`  ⚠️ text_fa خراب است - در حال اصلاح...`, 'warning');
                        
                        const { sentences, placeholders } = splitToSentences(story.text);
                        totalSentences += sentences.length;
                        document.getElementById('statSentences').textContent = totalSentences;
                        
                        const translatedParts = [];
                        
                        for (const sentence of sentences) {
                            if (sentence.trim()) {
                                const translated = await translate(sentence.trim());
                                translatedParts.push(translated);
                                doneSentences++;
                                document.getElementById('statDone').textContent = doneSentences;
                                await sleep(DELAY);
                            }
                        }
                        
                        let fullTranslation = translatedParts.join(' ');
                        fullTranslation = restoreBlanks(fullTranslation, placeholders);
                        story.text_fa = fullTranslation;
                        changed = true;
                        log(`  ✅ ترجمه شد (${sentences.length} جمله)`, 'success');
                    } else {
                        log(`  ✅ text_fa سالم است`, 'success');
                    }
                }

                // ترجمه title_fa اگر خراب است
                if (story.title && story.title_fa) {
                    const hasFrench = /[a-zA-Z]{3,}/.test(story.title_fa);
                    if (hasFrench) {
                        log(`  🔄 عنوان داستان...`, 'info');
                        story.title_fa = await translate(story.title);
                        await sleep(DELAY);
                        changed = true;
                    }
                }

                // ترجمه paragraphs اگر fa خراب است
                if (story.paragraphs) {
                    for (const para of story.paragraphs) {
                        if (para.fr && para.fa) {
                            const hasFrench = /[a-zA-Z]{3,}/.test(para.fa);
                            if (hasFrench) {
                                log(`  🔄 پاراگراف...`, 'info');
                                para.fa = await translate(para.fr);
                                await sleep(DELAY);
                                changed = true;
                            }
                        }
                    }
                }
            }

            if (changed) {
                fixedPack = pack;
                const result = JSON.stringify(pack, null, 2);
                document.getElementById('resultOutput').value = result;
                document.getElementById('resultSection').style.display = 'block';
                document.getElementById('downloadBtn').style.display = 'inline-block';
                log('\n✅ اصلاح کامل شد! فایل را دانلود کن و در GitHub جایگزین کن.', 'success');
            } else {
                log('\n⏭️ هیچ تغییری لازم نبود', 'info');
            }

            document.getElementById('fixBtn').disabled = false;
        }

        function downloadResult() {
            if (!fixedPack) return;
            
            const result = JSON.stringify(fixedPack, null, 2);
            const blob = new Blob([result], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${fixedPack.id}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            log('💾 فایل دانلود شد!', 'success');
        }
    </script>
</body>
</html>
