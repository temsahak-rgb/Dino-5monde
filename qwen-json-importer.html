<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 واردکننده هوشمند JSON از Qwen</title>
    <style>
        body { font-family: Tahoma, Arial; padding: 20px; background: linear-gradient(135deg, #087F5B 0%, #065f46 100%); min-height: 100vh; margin: 0; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        h1 { color: #087F5B; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #777; margin-bottom: 25px; font-size: 14px; }
        .setup { background: #f0f9ff; border: 2px solid #087F5B; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; margin: 12px 0 6px; font-weight: bold; color: #333; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; box-sizing: border-box; }
        textarea { min-height: 200px; font-family: monospace; font-size: 12px; resize: vertical; }
        .btn { background: #087F5B; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 15px; transition: 0.2s; }
        .btn:hover:not(:disabled) { background: #066b4c; transform: translateY(-2px); }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .log { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; margin-top: 20px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 13px; line-height: 1.6; }
        .log-success { color: #00ff00; } .log-error { color: #ff4444; } .log-info { color: #44aaff; } .log-warning { color: #ffaa00; }
        .preview { background: #fffbeb; border: 1px solid #fde68a; padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
        .preview strong { color: #b45309; }
        .checkbox-group { display: flex; gap: 20px; margin: 15px 0; flex-wrap: wrap; }
        .checkbox-group label { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: normal; cursor: pointer; }
        .checkbox-group input { width: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 واردکننده هوشمند JSON</h1>
        <p class="subtitle">کل متن پیام Qwen را پیست کنید. ربات خودش JSON را پیدا کرده، ID را تمیز می‌کند و در گیت‌هاب آپلود می‌کند.</p>

        <div class="setup">
            <label>GitHub Token:</label>
            <input type="password" id="token" placeholder="ghp_...">
            
            <label>نام کاربری GitHub:</label>
            <input type="text" id="username" value="temsahak-rgb">
            
            <label>نام مخزن:</label>
            <input type="text" id="repo" value="Dino-5monde">

            <div class="checkbox-group">
                <label><input type="checkbox" id="updateIndex" checked> به‌روزرسانی خودکار فهرست (vocab-{level}.json)</label>
            </div>

            <label>متن پیام Qwen را اینجا پیست کنید (شامل کد JSON):</label>
            <textarea id="qwenText" placeholder="مثال:
بفرمایید، این هم پک جدید:
```json
{
  &quot;id&quot;: &quot;numismatics_coins_369&quot;,
  &quot;level&quot;: &quot;C1&quot;,
  ...
}
```"></textarea>

            <button class="btn" id="processBtn" onclick="processAndUpload()">🚀 استخراج، تمیزسازی و آپلود</button>
        </div>

        <div class="preview" id="previewBox">
            <h3 style="margin-top:0; color:#b45309;">🔍 پیش‌نمایش تغییرات:</h3>
            <p>شناسه اصلی: <strong id="origId"></strong></p>
            <p>شناسه تمیزشده (بدون عدد): <strong id="cleanId" style="color:#087F5B;"></strong></p>
            <p>مسیر فایل در گیت‌هاب: <strong id="filePath"></strong></p>
            <button class="btn" id="confirmBtn" onclick="confirmUpload()" style="background:#d97706;">✅ تأیید و آپلود نهایی</button>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script>
        let cleanedPack = null;
        let targetPath = "";

        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('fa-IR');
            logDiv.innerHTML += `<div class="log-${type}">[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        async function githubGet(path, token, user, repo) {
            const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`, { 
                headers: { 'Authorization': `token ${token}` } 
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        }

        async function githubPut(path, content, sha, token, user, repo, message) {
            const body = { message, content: btoa(unescape(encodeURIComponent(content))) };
            if (sha) body.sha = sha;
            
            const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                const err = await res.text();
                throw new Error(`PUT failed: ${err}`);
            }
        }

        async function processAndUpload() {
            const text = document.getElementById('qwenText').value;
            if (!text.trim()) {
                log('❌ کادر متن خالی است', 'error');
                return;
            }

            log('🔍 در حال جستجوی JSON در متن...', 'info');
            
            // استخراج JSON با Regex (هم از داخل ```json و هم به صورت کلی)
            const jsonMatch = text.match(/```json\s*([\s\S]*?)```/) || text.match(/(\{[\s\S]*?"id"\s*:\s*"[^"]+"[\s\S]*?\})/);
            
            if (!jsonMatch) {
                log('❌ هیچ کد JSON معتبری در متن پیدا نشد. لطفاً کل پیام را کپی کنید.', 'error');
                return;
            }

            try {
                const rawJson = jsonMatch[1] || jsonMatch[0];
                const pack = JSON.parse(rawJson);

                if (!pack.id || !pack.level) {
                    throw new Error("فیلدهای 'id' یا 'level' در JSON یافت نشد.");
                }

                // 🧹 تمیزسازی ID: حذف اعداد و زیرخط انتهایی (مثلاً _369)
                const originalId = pack.id;
                const cleanId = originalId.replace(/_\d+$/, ''); // حذف _ و اعداد از انتهای رشته
                
                pack.id = cleanId; // به‌روزرسانی ID داخل خود JSON
                cleanedPack = pack;
                targetPath = `data/vocabulary/${pack.level}/${cleanId}.json`;

                // نمایش پیش‌نمایش
                document.getElementById('origId').textContent = originalId;
                document.getElementById('cleanId').textContent = cleanId;
                document.getElementById('filePath').textContent = targetPath;
                document.getElementById('previewBox').style.display = 'block';
                
                log(`✅ JSON استخراج شد. ID از "${originalId}" به "${cleanId}" تغییر یافت.`, 'success');
                log('⏳ در انتظار تأیید شما برای آپلود...', 'warning');

            } catch (e) {
                log(`❌ خطا در پردازش JSON: ${e.message}`, 'error');
            }
        }

        async function confirmUpload() {
            if (!cleanedPack) return;

            const token = document.getElementById('token').value.trim();
            const user = document.getElementById('username').value.trim();
            const repo = document.getElementById('repo').value.trim();
            const updateIndex = document.getElementById('updateIndex').checked;

            if (!token) {
                log('❌ لطفاً GitHub Token را وارد کنید', 'error');
                return;
            }

            localStorage.setItem('dino_token', token);
            document.getElementById('processBtn').disabled = true;
            document.getElementById('confirmBtn').disabled = true;

            try {
                log(`📤 در حال آپلود در: ${targetPath}`, 'info');
                
                // بررسی وجود فایل قبلی
                let existingSha = null;
                try {
                    const existing = await githubGet(targetPath, token, user, repo);
                    existingSha = existing.sha;
                    log('📄 فایل از قبل وجود داشت، در حال به‌روزرسانی...', 'info');
                } catch (e) {
                    log('📄 فایل جدید است، در حال ایجاد...', 'info');
                }

                // آپلود فایل JSON
                await githubPut(
                    targetPath, 
                    JSON.stringify(cleanedPack, null, 2), 
                    existingSha, 
                    token, 
                    user, 
                    repo, 
                    `🤖 Auto-import: ${cleanedPack.id} (cleaned ID)`
                );
                log(`✅ فایل ${cleanedPack.id}.json با موفقیت آپلود شد!`, 'success');

                // به‌روزرسانی فهرست
                if (updateIndex) {
                    log('📝 در حال به‌روزرسانی فهرست...', 'info');
                    const listPath = `data/vocabulary/vocab-${cleanedPack.level}.json`;
                    const listFile = await githubGet(listPath, token, user, repo);
                    const list = JSON.parse(decodeURIComponent(escape(atob(listFile.content))));
                    
                    const existingIndex = list.findIndex(p => p.id === cleanedPack.id || p.id === document.getElementById('origId').textContent);
                    const newEntry = {
                        id: cleanedPack.id,
                        title: cleanedPack.theme || cleanedPack.title,
                        title_fa: cleanedPack.theme_fa || cleanedPack.title_fa,
                        icon: cleanedPack.icon,
                        words: cleanedPack.words ? cleanedPack.words.length : 0
                    };
                    
                    if (existingIndex >= 0) {
                        list[existingIndex] = newEntry;
                    } else {
                        list.push(newEntry);
                    }
                    
                    await githubPut(listPath, JSON.stringify(list, null, 2), listFile.sha, token, user, repo, `📝 Update index for ${cleanedPack.id}`);
                    log('✅ فهرست با موفقیت به‌روز شد!', 'success');
                }

                log('🎉 عملیات با موفقیت به پایان رسید!', 'success');
                document.getElementById('previewBox').style.display = 'none';

            } catch (e) {
                log(`❌ خطا در آپلود: ${e.message}`, 'error');
            }

            document.getElementById('processBtn').disabled = false;
            document.getElementById('confirmBtn').disabled = false;
        }

        window.onload = function() {
            if (localStorage.getItem('dino_token')) document.getElementById('token').value = localStorage.getItem('dino_token');
        };
        document.getElementById('token').addEventListener('change', function(e) {
            localStorage.setItem('dino_token', e.target.value.trim());
        });
    </script>
</body>
</html>
