<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دیباگ لود travel.js</title>
    <style>
        body { font-family: Tahoma; padding: 20px; background: #f5f5f5; }
        .box { background: white; border-radius: 8px; padding: 20px; margin: 15px 0; }
        .error { background: #fef2f2; border: 2px solid #dc2626; }
        .success { background: #d1fae5; border: 2px solid #087F5B; }
        h1 { color: #087F5B; }
        h2 { margin-top: 0; }
        code { background: #1a1a1a; color: #00ff00; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
        pre { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 12px; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🔍 دیباگ لود travel.js</h1>
    <div id="result"></div>
    
    <script>
        const resultDiv = document.getElementById('result');
        
        async function debug() {
            resultDiv.innerHTML = '<div class="box"><h2>⏳ در حال بررسی...</h2></div>';
            
            let html = '';
            
            // ۱. چک کردن existence فایل travel.js
            try {
                const res = await fetch('./travel.js?v=' + Date.now());
                if (res.ok) {
                    const content = await res.text();
                    html += `<div class="box success">
                        <h2>✅ فایل travel.js وجود دارد!</h2>
                        <p>حجم فایل: <b>${content.length}</b> کاراکتر</p>
                        <p>شروع فایل:</p>
                        <pre>${content.substring(0, 200)}...</pre>
                    </div>`;
                    
                    // چک کردن existence تابع showTravelPage
                    if (content.includes('function showTravelPage')) {
                        html += `<div class="box success">
                            <h2>✅ تابع showTravelPage در فایل وجود دارد!</h2>
                        </div>`;
                    } else {
                        html += `<div class="box error">
                            <h2>❌ تابع showTravelPage در فایل نیست!</h2>
                            <p>فایل travel.js وجود دارد ولی تابع showTravelPage را ندارد.</p>
                        </div>`;
                    }
                } else {
                    html += `<div class="box error">
                        <h2>❌ فایل travel.js پیدا نشد!</h2>
                        <p>کد HTTP: <b>${res.status}</b></p>
                        <p>مسیر: <code>./travel.js</code></p>
                        <p><b>راه‌حل:</b> در گیت‌هاب چک کن که فایل <code>travel.js</code> در ریشه پروژه (کنار index.html) وجود دارد.</p>
                    </div>`;
                }
            } catch (e) {
                html += `<div class="box error">
                    <h2>❌ خطا در خواندن travel.js!</h2>
                    <p>پیام: ${e.message}</p>
                </div>`;
            }
            
            // ۲. چک کردن index.html
            try {
                const res = await fetch('./index.html?v=' + Date.now());
                if (res.ok) {
                    const content = await res.text();
                    html += `<div class="box success">
                        <h2>✅ فایل index.html خوانده شد</h2>
                    </div>`;
                    
                    if (content.includes('travel.js')) {
                        // پیدا کردن خط travel.js
                        const lines = content.split('\n');
                        const travelLine = lines.find(line => line.includes('travel.js'));
                        
                        html += `<div class="box success">
                            <h2>✅ اسکریپت travel.js در index.html اضافه شده!</h2>
                            <p>خط مربوطه:</p>
                            <pre>${travelLine.trim()}</pre>
                        </div>`;
                    } else {
                        html += `<div class="box error">
                            <h2>❌ اسکریپت travel.js در index.html نیست!</h2>
                            <p><b>راه‌حل:</b> این خط را به index.html اضافه کن:</p>
                            <pre>&lt;script src="travel.js?v=101"&gt;&lt;/script&gt;</pre>
                        </div>`;
                    }
                } else {
                    html += `<div class="box error">
                        <h2>❌ فایل index.html پیدا نشد!</h2>
                    </div>`;
                }
            } catch (e) {
                html += `<div class="box error">
                    <h2>❌ خطا در خواندن index.html!</h2>
                    <p>پیام: ${e.message}</p>
                </div>`;
            }
            
            // ۳. نتیجه نهایی
            html += `<div class="box">
                <h2>📋 نتیجه نهایی:</h2>
                <p>اگر همه چیز سبز است ولی هنوز کار نمی‌کند:</p>
                <ol>
                    <li>کش مرورگر را کاملاً پاک کن (Settings > Safari > Clear History and Website Data)</li>
                    <li>در index.html عدد ورژن travel.js را تغییر بده (مثلاً ?v=102)</li>
                    <li>سایت را کاملاً ببند و دوباره باز کن</li>
                </ol>
            </div>`;
            
            resultDiv.innerHTML = html;
        }
        
        debug();
    </script>
</body>
</html>
