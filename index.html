<script>
window.addEventListener('error', function(e) {
    var d = document.getElementById('err-box');
    if (!d) {
        d = document.createElement('div');
        d.id = 'err-box';
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ffe5e5;color:#a00;padding:12px;font-size:13px;z-index:99999;white-space:pre-wrap;border-bottom:2px solid #a00;font-family:monospace;direction:ltr;text-align:left;';
        document.body.appendChild(d);
    }
    d.textContent = '❌ ERROR: ' + e.message + ' | LINE: ' + e.lineno;
});
</script>
