<!doctype html>
<html lang="fr" dir="ltr">
    <body style="margin:0;background:#f4f7f5;color:#17211b;font-family:Arial,sans-serif;padding:24px">
        <main style="background:#ffffff;border:1px solid #dce5df;border-radius:16px;margin:0 auto;max-width:520px;padding:32px">
            <p style="color:#087f5b;font-size:14px;font-weight:700;margin:0 0 12px">Français avec Dino 🦖</p>
            <h1 style="font-size:24px;margin:0 0 16px">Votre code de connexion</h1>
            <p style="font-size:16px;line-height:1.6;margin:0 0 20px">Saisissez ce code à 6 chiffres dans Dino. Il expire dans 10 minutes.</p>
            <p style="background:#eaf7f1;border-radius:12px;color:#065f46;font-size:32px;font-weight:800;letter-spacing:8px;margin:0;padding:18px;text-align:center">{{ .Token }}</p>
            <div dir="rtl" lang="fa" style="border-top:1px solid #dce5df;margin-top:28px;padding-top:24px;text-align:right">
                <h2 style="font-size:20px;margin:0 0 12px">کد ورود شما</h2>
                <p style="font-size:15px;line-height:1.8;margin:0">این کد ۶ رقمی را در دینو وارد کنید. کد پس از ۱۰ دقیقه منقضی می‌شود.</p>
            </div>
            <p style="color:#66736c;font-size:12px;line-height:1.6;margin:28px 0 0">Si vous n’avez pas demandé ce code, ignorez cet email. Ne partagez jamais ce code.</p>
        </main>
    </body>
</html>
