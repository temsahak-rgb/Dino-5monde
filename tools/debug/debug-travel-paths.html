<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 دیباگ مسیرهای Travel</title>
    <style>
        body { font-family: Tahoma; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #087F5B; }
        .setup { background: #f0f9ff; border: 2px solid #087F5B; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; margin: 12px 0 6px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { background: #087F5B; color: white; border: none; padding: 14px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
        .log { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; margin-top: 20px; max-height: 500px; overflow-y: auto; font-family: monospace; font-size: 13px; line-height: 1.6; }
        .log-success { color: #00ff00; } .log-error { color: #ff4444; } .log-info { color: #44aaff; } .log-warning { color: #ffaa00; }
        .match { background: #d1fae5; padding: 8px; border-radius: 4px; margin: 4px 0; }
        .mismatch { background: #fee2e2; padding: 8px; border-radius: 4px; margin: 4px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 دیباگ مسیرهای Travel</h1>
        <p>این ابزار نشان می‌دهد کدام ID با کدام فایل مطابقت دارد.</p>

        <div class="setup">
            <label>GitHub Token:</label>
            <input type="password" id="token" placeholder="ghp_...">
        </div>

        <button class="btn" onclick="debugPaths()">🔍 بررسی مسیرها</button>

        <div class="log" id="log"></div>
    </div>

    <script>
        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('fa-IR');
            logDiv.innerHTML += `<div class="log-${type}">[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function githubGet(path, token, user, repo) {
            const url = `https://api.github.com/repos/${user}/${repo}/contents/${path}`;
            const res = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        }

        async function debugPaths() {
            const token = document.getElementById('token').value.trim();
            const username = "temsahak-rgb";
            const repo = "Dino-5monde";

            if (!token) {
                log('❌ Token را وارد کن', 'error');
                return;
            }

            log('🔍 شروع بررسی...', 'info');

            try {
                // ۱. خواندن lessons.json
                const lessonsFile = await githubGet('data/travel/lessons.json', token, username, repo);
                const lessons = JSON.parse(decodeURIComponent(escape(atob(lessonsFile.content))));
                log(`✅ ${lessons.length} درس در lessons.json`, 'success');

                // ۲. خواندن لیست فایل‌ها
                const filesList = await githubGet('data/travel/lessons', token, username, repo);
                const lessonFiles = filesList.filter(f => f.name.endsWith('.json'));
                log(`✅ ${lessonFiles.length} فایل در پوشه lessons/`, 'success');

                // ۳. مقایسه
                log('\n📊 بررسی تطابق ID ها با فایل‌ها:', 'info');
                
                const fileNames = lessonFiles.map(f => f.name.replace('.json', ''));
                
                let matchCount = 0;
                let mismatchCount = 0;

                lessons.forEach(lesson => {
                    const expectedPath = `data/travel/lessons/${lesson.id}.json`;
                    
                    if (fileNames.includes(lesson.id)) {
                        log(`✅ ${lesson.id} → فایل موجود است`, 'success');
                        matchCount++;
                    } else {
                        // جستجوی فایل مشابه
                        const similar = fileNames.find(f => 
                            f.toLowerCase().replace(/[-_]/g, '').includes(lesson.id.toLowerCase().replace(/[-_]/g, '').substring(0, 15))
                        );
                        
                        if (similar) {
                            log(`❌ ${lesson.id} → فایل نیست! احتمالاً: ${similar}.json`, 'error');
                        } else {
                            log(`❌ ${lesson.id} → فایل نیست و مشابهی پیدا نشد`, 'error');
                        }
                        mismatchCount++;
                    }
                });

                log(`\n\n📊 خلاصه:`, 'info');
                log(`✅ ${matchCount} ID با فایل مطابقت دارد`, 'success');
                log(`❌ ${mismatchCount} ID با فایل مطابقت ندارد`, 'error');

                if (mismatchCount > 0) {
                    log('\n💡 راه‌حل:', 'info');
                    log('۱. یا نام فایل‌ها را تغییر بده تا با ID مطابقت داشته باشد', 'info');
                    log('۲. یا ID در lessons.json را تغییر بده تا با نام فایل مطابقت داشته باشد', 'info');
                }

            } catch (e) {
                log(`❌ خطا: ${e.message}`, 'error');
            }
        }

        window.onload = function() {
            if (localStorage.getItem('dino_token')) document.getElementById('token').value = localStorage.getItem('dino_token');
        };
    </script>
</body>
</html>
