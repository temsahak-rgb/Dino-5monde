<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 ربات ترجمه با Gemini</title>
    <style>
        body { font-family: Tahoma; padding: 20px; background: #f5f5f5; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #087F5B; }
        .setup { background: #f0f9ff; border: 2px solid #087F5B; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; margin: 12px 0 6px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { background: #087F5B; color: white; border: none; padding: 14px 28px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 15px; }
        .btn:disabled { background: #ccc; }
        .btn-stop { background: #dc2626; }
        .log { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; margin-top: 20px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 13px; }
        .log-success { color: #00ff00; }
        .log-error { color: #ff4444; }
        .log-info { color: #44aaff; }
        .log-warning { color: #ffaa00; }
        .progress-bar { background: #e0e0e0; height: 8px; border-radius: 4px; overflow: hidden; margin: 15px 0; }
        .progress-fill { background: linear-gradient(90deg, #087F5B, #10b981); height: 100%; width: 0%; transition: width 0.3s; }
        .help { background: #fffbeb; border: 1px solid #fde68a; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .help a { color: #087F5B; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 ربات ترجمه با Google Gemini</h1>
        
        <div class="help">
            <strong>📋 راهنما:</strong><br>
            ۱. برو به <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a><br>
            ۲. دکمه "Get API Key" را بزن و یک کلید جدید بساز (رایگان)<br>
            ۳. کلید را در کادر پایین وارد کن
        </div>

        <div class="setup">
            <label>Google Gemini API Key:</label>
            <input type="password" id="geminiKey" placeholder="AIza...">
            
            <label>GitHub Token:</label>
            <input type="password" id="token" placeholder="ghp_...">
            
            <label>نام کاربری GitHub:</label>
            <input type="text" id="username" value="temsahak-rgb">
            
            <label>نام مخزن:</label>
            <input type="text" id="repo" value="Dino-5monde">
            
            <label>سطح:</label>
            <select id="level">
                <option value="all">همه سطوح</option>
                <option value="A1">فقط A1</option>
                <option value="A2">فقط A2</option>
                <option value="B1">فقط B1</option>
                <option value="B2">فقط B2</option>
                <option value="C1">فقط C1</option>
                <option value="C2">فقط C2</option>
            </select>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <button class="btn" id="startBtn" onclick="startTranslation()">🚀 شروع ترجمه</button>
        <button class="btn btn-stop" id="stopBtn" onclick="stopTranslation()" style="display:none;">⏹ توقف</button>

        <div class="log" id="log"></div>
    </div>

    <script>
        let shouldStop = false;

        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('fa-IR');
            logDiv.innerHTML += `<div class="log-${type}">[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function updateProgress(current, total) {
            const pct = total > 0 ? (current / total) * 100 : 0;
            document.getElementById('progressFill').style.width = pct + '%';
        }

        // ترجمه با Gemini
        async function translateWithGemini(text, apiKey) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            const prompt = `ترجمه دقیق و روان این متن فرانسوی به فارسی. فقط ترجمه را برگردان، هیچ توضیح اضافه‌ای نده:

${text}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });
                
                const data = await response.json();
                
                if (data.candidates && data.candidates[0]) {
                    return data.candidates[0].content.parts[0].text.trim();
                }
                return text;
            } catch (e) {
                log(`❌ خطا در ترجمه: ${e.message}`, 'error');
                return text;
            }
        }

        async function githubGet(path, token, user, repo) {
            const url = `https://api.github.com/repos/${user}/${repo}/contents/${path}`;
            const res = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        }

        async function githubPut(path, content, sha, token, user, repo, message) {
            const url = `https://api.github.com/repos/${user}/${repo}/contents/${path}`;
            const res = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: message,
                    content: btoa(unescape(encodeURIComponent(content))),
                    sha: sha
                })
            });
            if (!res.ok) throw new Error(`PUT failed`);
            return await res.json();
        }

        async function translatePack(path, geminiKey, token, user, repo) {
            log(`📥 خواندن: ${path}`, 'info');
            const file = await githubGet(path, token, user, repo);
            const content = decodeURIComponent(escape(atob(file.content)));
            const pack = JSON.parse(content);
            
            let changed = false;

            if (!pack.stories) return { changed, path, sha: file.sha, content: JSON.stringify(pack, null, 2) };

            for (const [key, story] of Object.entries(pack.stories)) {
                if (shouldStop) break;

                // ترجمه text_fa
                if (story.text && (!story.text_fa || /[a-zA-Z]{3,}/.test(story.text_fa))) {
                    log(`  🔄 ترجمه text_fa در ${key}...`, 'info');
                    const cleanText = story.text.replace(/\{\{BLANK_\d+\}\}/g, '___');
                    story.text_fa = await translateWithGemini(cleanText, geminiKey);
                    await sleep(1000);
                    changed = true;
                    log(`  ✅ ترجمه شد`, 'success');
                }

                // ترجمه title_fa
                if (story.title && (!story.title_fa || /[a-zA-Z]{3,}/.test(story.title_fa))) {
                    log(`  🔄 ترجمه title_fa...`, 'info');
                    story.title_fa = await translateWithGemini(story.title, geminiKey);
                    await sleep(1000);
                    changed = true;
                }

                // ترجمه paragraphs
                if (story.paragraphs) {
                    for (const para of story.paragraphs) {
                        if (shouldStop) break;
                        if (para.fr && (!para.fa || /[a-zA-Z]{3,}/.test(para.fa))) {
                            log(`  🔄 ترجمه پاراگراف...`, 'info');
                            para.fa = await translateWithGemini(para.fr, geminiKey);
                            await sleep(1000);
                            changed = true;
                        }
                    }
                }
            }

            return { changed, path, sha: file.sha, content: JSON.stringify(pack, null, 2) };
        }

        async function startTranslation() {
            const geminiKey = document.getElementById('geminiKey').value.trim();
            const token = document.getElementById('token').value.trim();
            const user = document.getElementById('username').value.trim();
            const repo = document.getElementById('repo').value.trim();
            const levelFilter = document.getElementById('level').value;

            if (!geminiKey || !token || !user || !repo) {
                log('❌ همه فیلدها را پر کن', 'error');
                return;
            }

            shouldStop = false;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').style.display = 'inline-block';
            log('🚀 شروع ترجمه با Gemini...', 'info');

            try {
                const levels = levelFilter === 'all' ? ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'] : [levelFilter];
                const allPacks = [];

                for (const lv of levels) {
                    try {
                        const listFile = await githubGet(`data/vocabulary/vocab-${lv}.json`, token, user, repo);
                        const list = JSON.parse(decodeURIComponent(escape(atob(listFile.content))));
                        for (const pack of list) {
                            allPacks.push({ level: lv, id: pack.id });
                        }
                    } catch (e) {
                        log(`⚠️ سطح ${lv} پیدا نشد`, 'warning');
                    }
                }

                log(`📊 ${allPacks.length} پک پیدا شد`, 'info');
                
                let fixedCount = 0;

                for (let i = 0; i < allPacks.length; i++) {
                    if (shouldStop) break;

                    const pack = allPacks[i];
                    const path = `data/vocabulary/${pack.level}/${pack.id}.json`;
                    
                    try {
                        const result = await translatePack(path, geminiKey, token, user, repo);
                        
                        if (result.changed) {
                            log(`  💾 Commit: ${path}`, 'success');
                            await githubPut(path, result.content, result.sha, token, user, repo, `🤖 Gemini translate: ${pack.id}`);
                            fixedCount++;
                        }
                    } catch (e) {
                        log(`  ❌ خطا: ${e.message}`, 'error');
                    }

                    updateProgress(i + 1, allPacks.length);
                }

                log(`🎉 پایان! ${fixedCount} فایل ترجمه شد.`, 'success');
            } catch (e) {
                log(`❌ خطا: ${e.message}`, 'error');
            }

            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').style.display = 'none';
        }

        function stopTranslation() {
            shouldStop = true;
            log('⏹ توقف...', 'warning');
        }

        window.onload = function() {
            const savedToken = localStorage.getItem('dino_token');
            const savedGemini = localStorage.getItem('dino_gemini');
            if (savedToken) document.getElementById('token').value = savedToken;
            if (savedGemini) document.getElementById('geminiKey').value = savedGemini;
        };
    </script>
</body>
</html>
