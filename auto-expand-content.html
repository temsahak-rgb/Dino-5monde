<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 ربات گسترش‌دهنده محتوا (داستان + کوییز + بازی)</title>
    <style>
        body { font-family: Tahoma; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        h1 { color: #087F5B; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #777; margin-bottom: 25px; font-size: 14px; }
        .setup { background: #f0f9ff; border: 2px solid #087F5B; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; margin: 12px 0 6px; font-weight: bold; color: #333; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { background: #087F5B; color: white; border: none; padding: 18px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; margin-top: 15px; transition: 0.2s; }
        .btn:hover:not(:disabled) { background: #066b4c; transform: translateY(-2px); }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn-stop { background: #dc2626; }
        .log { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; margin-top: 20px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 13px; line-height: 1.6; }
        .log-success { color: #00ff00; } .log-error { color: #ff4444; } .log-info { color: #44aaff; } .log-warning { color: #ffaa00; }
        .progress-bar { background: #e0e0e0; height: 12px; border-radius: 6px; overflow: hidden; margin: 15px 0; }
        .progress-fill { background: linear-gradient(90deg, #087F5B, #10b981); height: 100%; width: 0%; transition: width 0.3s; }
        .help { background: #fffbeb; border: 1px solid #fde68a; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; text-align: center; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .stat-box { background: #f0f9ff; padding: 12px; border-radius: 6px; text-align: center; border: 1px solid #087F5B; }
        .stat-value { font-size: 24px; font-weight: bold; color: #087F5B; }
        .stat-label { font-size: 11px; color: #777; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 ربات گسترش‌دهنده محتوا</h1>
        <p class="subtitle">ربات همه پک‌ها را می‌گیرد و داستان‌های جدید، کوییزهای بیشتر و بازی‌های تعاملی می‌سازد.</p>

        <div class="help">
            🔑 API Key و GitHub Token را وارد کن و دکمه را بزن.<br>
            ربات <strong>همه پک‌ها</strong> را پردازش می‌کند (حتی آن‌هایی که از قبل کامل هستند).
        </div>

        <div class="setup">
            <label>Google Gemini API Key:</label>
            <input type="password" id="geminiKey" placeholder="AIza...">
            
            <label>GitHub Token:</label>
            <input type="password" id="token" placeholder="ghp_...">
            
            <label>حالت پردازش:</label>
            <select id="mode">
                <option value="all">همه پک‌ها (توصیه شده)</option>
                <option value="incomplete">فقط پک‌های ناقص</option>
                <option value="expand">فقط پک‌های کامل (برای گسترش)</option>
            </select>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">کل پک‌ها</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="statProcessed">0</div>
                <div class="stat-label">پردازش شده</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="statSkipped">0</div>
                <div class="stat-label">رد شده</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="statErrors">0</div>
                <div class="stat-label">خطا</div>
            </div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        
        <button class="btn" id="startBtn" onclick="startExpansion()">🚀 شروع گسترش محتوا</button>
        <button class="btn btn-stop" id="stopBtn" onclick="stopExpansion()" style="display:none;">⏹ توقف</button>
        
        <div class="log" id="log"></div>
    </div>

    <script>
        let shouldStop = false;

        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('fa-IR');
            logDiv.innerHTML += `<div class="log-${type}">[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        function updateProgress(current, total) {
            document.getElementById('progressFill').style.width = (total > 0 ? (current / total) * 100 : 0) + '%';
        }

        function updateStats(total, processed, skipped, errors) {
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statProcessed').textContent = processed;
            document.getElementById('statSkipped').textContent = skipped;
            document.getElementById('statErrors').textContent = errors;
        }

        async function callGemini(prompt, apiKey) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.8, maxOutputTokens: 8192 }
                    })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0]) {
                    return data.candidates[0].content.parts[0].text;
                }
                throw new Error('پاسخی از Gemini دریافت نشد');
            } catch (e) {
                throw new Error(`خطای Gemini: ${e.message}`);
            }
        }

        async function githubGet(path, token, user, repo) {
            const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`, { 
                headers: { 'Authorization': `token ${token}` } 
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        }

        async function githubPut(path, content, sha, token, user, repo, message) {
            const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(content))), sha })
            });
            if (!res.ok) throw new Error(`PUT failed`);
        }

        async function expandPackContent(pack, geminiKey) {
            const level = pack.level;
            const theme = pack.theme || pack.title || 'Vocabulaire';
            const themeFa = pack.theme_fa || pack.title_fa || 'واژگان';
            const icon = pack.icon || '📚';
            const existingStories = pack.stories ? Object.keys(pack.stories).length : 0;
            const existingQuiz = pack.quiz && pack.quiz.questions ? pack.quiz.questions.length : 0;
            
            const wordsList = pack.words.map(w => `- ${w.fr} | ${w.fa}`).join('\n');

            const prompt = `# RÔLE
Tu es un ingénieur pédagogique FLE expert et créatif. Je te donne un paquet de vocabulaire qui possède DÉJÀ ${existingStories} histoire(s) et ${existingQuiz} question(s) de quiz.
Ta tâche est de générer du CONTENU NOUVEAU ET DIFFÉRENT pour enrichir ce paquet.

# DONNÉES DU PAQUET
- Niveau: ${level}
- Thème: ${theme}
- Thème (FA): ${themeFa}
- Icône: ${icon}
- Liste des mots (${pack.words.length} mots):
${wordsList}

# OBJECTIF
Génère UNIQUEMENT les parties suivantes en JSON:

1. **stories_extra** (2-3 nouvelles histoires DIFFÉRENTES des existantes):
   - "story1": histoire simple avec blanks
   - "story2": histoire littéraire avec blanks
   - "story3": dialogue ou scène courte (optionnel)

2. **quiz_extra** (20-30 NOUVELLES questions DIFFÉRENTES):
   - Questions sur le sens des mots
   - Questions sur le contexte
   - Questions binary (vrai/faux)
   - Questions sur les expressions

3. **games** (2-3 jeux interactifs):
   - "memory": jeu de mémoire (paires mot-traduction)
   - "match": jeu d'association (mot-définition)
   - "fill": jeu de remplissage de phrases

# SCHÉMA DE SORTIE (JSON SEULEMENT)
{
  "stories_extra": {
    "story1": {
      "title": "<titre créatif>",
      "title_fa": "<ترجمه فارسی>",
      "text": "<récit avec {{BLANK_1}}...>",
      "text_fa": "<ترجمه فارسی avec ___>",
      "blanks": [...]
    },
    "story2": {
      "title": "<titre littéraire>",
      "title_fa": "<ترجمه فارسی>",
      "text": "<récit complexe avec {{BLANK_1}}...>",
      "text_fa": "<ترجمه فارسی avec ___>",
      "blanks": [...]
    }
  },
  "quiz_extra": {
    "questions": [
      { "type": "mcq", "question": "Phrase à trou avec ____", "options": ["A", "B", "C", "D"], "correctIndex": 0, "explanation_fa": "توضیح" },
      { "type": "binary", "question": "Affirmation", "options": ["Vrai", "Faux"], "correctIndex": 0, "explanation_fa": "توضیح" }
    ]
  },
  "games": {
    "memory": {
      "title": "Jeu de mémoire",
      "title_fa": "بازی حافظه",
      "pairs": [
        { "fr": "le mot", "fa": "ترجمه" }
      ]
    },
    "match": {
      "title": "Jeu d'association",
      "title_fa": "بازی تطبیق",
      "items": [
        { "word": "le mot", "definition": "définition simple en français" }
      ]
    }
  }
}

# RÈGLES STRICTES :
1. Génère UNIQUEMENT le JSON. Pas de texte avant ou après.
2. Le contenu doit être DIFFÉRENT de ce qui existe déjà.
3. Chaque mot de la liste doit être utilisé au moins une fois.
4. Les histoires doivent être créatives et engageantes.
5. Le quiz doit tester différentes compétences (sens, contexte, expressions).
6. Les jeux doivent être interactifs et amusants.
7. Dans "text_fa", remplace les {{BLANK_X}} par "___".
8. JSON valide uniquement, pas de Markdown.`;

            const response = await callGemini(prompt, geminiKey);
            const jsonMatch = response.match(/\{[\s\S]*\}/);
            if (!jsonMatch) throw new Error('JSON معتبر در پاسخ یافت نشد');
            
            return JSON.parse(jsonMatch[0]);
        }

        async function startExpansion() {
            const geminiKey = document.getElementById('geminiKey').value.trim();
            const token = document.getElementById('token').value.trim();
            const mode = document.getElementById('mode').value;
            const user = "temsahak-rgb";
            const repo = "Dino-5monde";

            if (!geminiKey || !token) {
                log('❌ لطفاً API Key و GitHub Token را وارد کن', 'error');
                return;
            }

            localStorage.setItem('dino_gemini', geminiKey);
            localStorage.setItem('dino_token', token);

            shouldStop = false;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').style.display = 'inline-block';
            log('🔍 در حال جستجو برای همه پک‌ها...', 'info');

            try {
                const levelsToScan = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
                const allPacks = [];

                for (const lv of levelsToScan) {
                    try {
                        const listFile = await githubGet(`data/vocabulary/vocab-${lv}.json`, token, user, repo);
                        const list = JSON.parse(decodeURIComponent(escape(atob(listFile.content))));
                        list.forEach(p => allPacks.push({ level: lv, id: p.id }));
                    } catch (e) { /* نادیده گرفتن */ }
                }

                if (allPacks.length === 0) {
                    log('⚠️ هیچ پکی پیدا نشد.', 'warning');
                    return;
                }

                log(`✅ ${allPacks.length} پک پیدا شد. شروع گسترش محتوا...`, 'success');
                updateStats(allPacks.length, 0, 0, 0);
                
                let processedCount = 0;
                let skippedCount = 0;
                let errorCount = 0;

                for (let i = 0; i < allPacks.length; i++) {
                    if (shouldStop) {
                        log('⏹ فرآیند توسط شما متوقف شد.', 'warning');
                        break;
                    }

                    const packInfo = allPacks[i];
                    const path = `data/vocabulary/${packInfo.level}/${packInfo.id}.json`;
                    
                    log(`📦 پردازش ${i + 1}/${allPacks.length}: ${packInfo.id}`, 'info');
                    
                    try {
                        const file = await githubGet(path, token, user, repo);
                        const pack = JSON.parse(decodeURIComponent(escape(atob(file.content))));

                        const hasStories = pack.stories && pack.stories.simple && pack.stories.simple.text;
                        const hasQuiz = pack.quiz && pack.quiz.questions && pack.quiz.questions.length >= 10;
                        const isComplete = hasStories && hasQuiz;

                        // تصمیم‌گیری بر اساس حالت
                        let shouldProcess = false;
                        if (mode === 'all') shouldProcess = true;
                        else if (mode === 'incomplete') shouldProcess = !isComplete;
                        else if (mode === 'expand') shouldProcess = isComplete;

                        if (shouldProcess) {
                            log(`  🚀 در حال تولید محتوای جدید با AI (ممکن است ۱۵-۳۰ ثانیه طول بکشد)...`, 'info');
                            
                            const newContent = await expandPackContent(pack, geminiKey);
                            
                            // ادغام محتوای جدید
                            if (newContent.stories_extra) {
                                if (!pack.stories_extra) pack.stories_extra = {};
                                Object.assign(pack.stories_extra, newContent.stories_extra);
                            }
                            if (newContent.quiz_extra && newContent.quiz_extra.questions) {
                                if (!pack.quiz_extra) pack.quiz_extra = { questions: [] };
                                pack.quiz_extra.questions.push(...newContent.quiz_extra.questions);
                            }
                            if (newContent.games) {
                                pack.games = newContent.games;
                            }
                            
                            log(`  💾 در حال ذخیره در گیت‌هاب...`, 'info');
                            await githubPut(path, JSON.stringify(pack, null, 2), file.sha, token, user, repo, 
                                `🚀 expand content: ${packInfo.id} (added stories/quiz/games)`);
                            
                            log(`  ✅ ${packInfo.id} با موفقیت گسترش یافت!`, 'success');
                            processedCount++;
                        } else {
                            log(`  ⏭️ ${packInfo.id} رد شد (بر اساس حالت انتخابی)`, 'info');
                            skippedCount++;
                        }
                    } catch (e) {
                        log(`  ❌ خطا در ${packInfo.id}: ${e.message}`, 'error');
                        errorCount++;
                    }
                    
                    updateStats(allPacks.length, processedCount, skippedCount, errorCount);
                    updateProgress(i + 1, allPacks.length);
                    await sleep(3000);
                }

                log(`🎉 عملیات پایان یافت!`, 'success');
                log(`📊 خلاصه: ${processedCount} پک گسترش یافت | ${skippedCount} رد شد | ${errorCount} خطا`, 'success');

            } catch (e) {
                log(`❌ خطای کلی: ${e.message}`, 'error');
            }

            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').style.display = 'none';
        }

        function stopExpansion() {
            shouldStop = true;
            log('⏹ درخواست توقف ثبت شد...', 'warning');
        }

        window.onload = function() {
            if (localStorage.getItem('dino_gemini')) document.getElementById('geminiKey').value = localStorage.getItem('dino_gemini');
            if (localStorage.getItem('dino_token')) document.getElementById('token').value = localStorage.getItem('dino_token');
        };
    </script>
</body>
</html>
