<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دیباگ همه درس‌ها</title>
    <style>
        body { font-family: Tahoma; padding: 20px; background: #f5f5f5; }
        .box { background: white; border-radius: 8px; padding: 20px; margin: 20px 0; }
        .error { background: #fef2f2; border: 2px solid #dc2626; }
        .success { background: #d1fae5; border: 2px solid #087F5B; }
        .warning { background: #fffbeb; border: 2px solid #f59e0b; }
        h1 { color: #087F5B; }
        h2 { color: #1a1a1a; margin-top: 0; }
        .lesson-item { background: #f9fafb; border: 1px solid #e0e0e0; border-radius: 6px; padding: 15px; margin: 10px 0; }
        .lesson-ok { border-left: 4px solid #087F5B; }
        .lesson-error { border-left: 4px solid #dc2626; }
        .lesson-warning { border-left: 4px solid #f59e0b; }
        code { background: #1a1a1a; color: #00ff00; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🔍 دیباگ همه درس‌های سفر</h1>
    <div id="result"></div>
    
    <script>
        const resultDiv = document.getElementById('result');
        
        async function debugAllLessons() {
            resultDiv.innerHTML = '<div class="box"><h2>⏳ در حال بررسی...</h2></div>';
            
            try {
                // ۱. خواندن lessons.json
                const res = await fetch('./data/travel/lessons.json?v=' + Date.now());
                if (!res.ok) {
                    resultDiv.innerHTML = `<div class="box error"><h2>❌ فایل lessons.json پیدا نشد!</h2><p>کد HTTP: ${res.status}</p></div>`;
                    return;
                }
                
                const lessons = await res.json();
                
                if (!Array.isArray(lessons) || lessons.length === 0) {
                    resultDiv.innerHTML = `<div class="box error"><h2>❌ فایل lessons.json خالی یا نامعتبر است!</h2></div>`;
                    return;
                }
                
                resultDiv.innerHTML = `<div class="box success"><h2>✅ فایل lessons.json سالم است!</h2><p>تعداد درس‌ها: <b>${lessons.length}</b></p></div>`;
                
                // ۲. بررسی هر درس
                let html = '<div class="box"><h2>📚 بررسی تک‌تک درس‌ها:</h2>';
                
                for (let i = 0; i < lessons.length; i++) {
                    const lesson = lessons[i];
                    const filePath = `./data/travel/lessons/${lesson.id}.json`;
                    
                    html += `<div class="lesson-item" id="lesson-${i}">`;
                    html += `<h3>${lesson.icon || '📝'} ${lesson.title_fa || lesson.title}</h3>`;
                    html += `<p><b>ID:</b> <code>${lesson.id}</code></p>`;
                    html += `<p><b>مسیر فایل:</b> <code>${filePath}</code></p>`;
                    html += `<div id="status-${i}">⏳ در حال بررسی...</div>`;
                    html += `</div>`;
                }
                
                html += '</div>';
                resultDiv.innerHTML += html;
                
                // ۳. تست هر فایل
                for (let i = 0; i < lessons.length; i++) {
                    const lesson = lessons[i];
                    const filePath = `./data/travel/lessons/${lesson.id}.json`;
                    const statusDiv = document.getElementById(`status-${i}`);
                    const lessonDiv = document.getElementById(`lesson-${i}`);
                    
                    try {
                        const fileRes = await fetch(filePath + '?v=' + Date.now());
                        
                        if (!fileRes.ok) {
                            statusDiv.innerHTML = `❌ <b>فایل پیدا نشد!</b> (کد HTTP: ${fileRes.status})`;
                            lessonDiv.classList.add('lesson-error');
                            continue;
                        }
                        
                        const fileContent = await fileRes.json();
                        
                        if (!fileContent.miniLessons || fileContent.miniLessons.length === 0) {
                            statusDiv.innerHTML = `⚠️ <b>فایل خوانده شد ولی miniLessons ندارد!</b>`;
                            lessonDiv.classList.add('lesson-warning');
                            continue;
                        }
                        
                        statusDiv.innerHTML = `✅ <b>فایل سالم است!</b> (${fileContent.miniLessons.length} مینی‌درس)`;
                        lessonDiv.classList.add('lesson-ok');
                        
                    } catch (e) {
                        statusDiv.innerHTML = `❌ <b>خطا در خواندن فایل:</b> ${e.message}`;
                        lessonDiv.classList.add('lesson-error');
                    }
                }
                
            } catch (e) {
                resultDiv.innerHTML = `<div class="box error"><h2>❌ خطای ناشناخته!</h2><p>${e.message}</p></div>`;
            }
        }
        
        debugAllLessons();
    </script>
</body>
</html>
