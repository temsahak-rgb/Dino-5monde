<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تست lessons.json</title>
    <style>
        body { font-family: Tahoma; padding: 20px; background: #f5f5f5; }
        .box { background: white; border-radius: 8px; padding: 20px; margin: 20px 0; }
        .error { background: #fef2f2; border: 2px solid #dc2626; }
        .success { background: #d1fae5; border: 2px solid #087F5B; }
        pre { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 12px; max-height: 400px; overflow-y: auto; }
        h1 { color: #087F5B; }
        h2 { color: #1a1a1a; margin-top: 0; }
    </style>
</head>
<body>
    <h1>🔍 تست فایل lessons.json</h1>
    <div id="result"></div>
    
    <script>
        const resultDiv = document.getElementById('result');
        
        async function test() {
            resultDiv.innerHTML = '<div class="box"><h2>⏳ در حال خواندن فایل...</h2></div>';
            
            try {
                const res = await fetch('./data/travel/lessons.json?v=' + Date.now());
                
                if (!res.ok) {
                    resultDiv.innerHTML = `
                        <div class="box error">
                            <h2>❌ فایل پیدا نشد!</h2>
                            <p><b>کد HTTP:</b> ${res.status}</p>
                            <p><b>مسیر:</b> <code>./data/travel/lessons.json</code></p>
                            <p><b>راه‌حل:</b> در گیت‌هاب چک کن که فایل <code>data/travel/lessons.json</code> وجود دارد.</p>
                        </div>`;
                    return;
                }
                
                const text = await res.text();
                resultDiv.innerHTML += `<div class="box"><h2>📄 محتوای خام فایل:</h2><pre>${text}</pre></div>`;
                
                try {
                    const lessons = JSON.parse(text);
                    
                    if (!Array.isArray(lessons)) {
                        resultDiv.innerHTML += `
                            <div class="box error">
                                <h2>❌ فایل JSON معتبر نیست!</h2>
                                <p>محتوا یک آرایه نیست. باید با <code>[</code> شروع شود.</p>
                            </div>`;
                        return;
                    }
                    
                    if (lessons.length === 0) {
                        resultDiv.innerHTML += `
                            <div class="box error">
                                <h2>⚠️ فایل خالی است!</h2>
                                <p>تعداد درس‌ها: <b>0</b></p>
                                <p><b>راه‌حل:</b> باید حداقل یک درس در فایل باشد.</p>
                            </div>`;
                        return;
                    }
                    
                    resultDiv.innerHTML += `
                        <div class="box success">
                            <h2>✅ فایل سالم است!</h2>
                            <p><b>تعداد درس‌ها:</b> ${lessons.length}</p>
                            <p><b>اولین درس:</b> ${lessons[0].title_fa || lessons[0].title}</p>
                            <p><b>ID اولین درس:</b> <code>${lessons[0].id}</code></p>
                        </div>`;
                    
                    resultDiv.innerHTML += `<div class="box"><h2>📚 لیست همه درس‌ها:</h2><ul>`;
                    lessons.forEach((lesson, idx) => {
                        resultDiv.innerHTML += `<li><b>${idx + 1}.</b> ${lesson.icon || '📝'} ${lesson.title_fa || lesson.title} (ID: <code>${lesson.id}</code>)</li>`;
                    });
                    resultDiv.innerHTML += `</ul></div>`;
                    
                } catch (e) {
                    resultDiv.innerHTML += `
                        <div class="box error">
                            <h2>❌ خطا در تجزیه JSON!</h2>
                            <p><b>پیام خطا:</b> ${e.message}</p>
                            <p><b>راه‌حل:</b> فایل JSON معتبر نیست. احتمالاً کاما اضافی در انتهای لیست دارد یا پرانتز بسته نشده است.</p>
                        </div>`;
                }
                
            } catch (e) {
                resultDiv.innerHTML = `
                    <div class="box error">
                        <h2>❌ خطای ناشناخته!</h2>
                        <p><b>پیام:</b> ${e.message}</p>
                    </div>`;
            }
        }
        
        test();
    </script>
</body>
</html>
